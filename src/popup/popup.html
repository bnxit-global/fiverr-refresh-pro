<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="popup.css">
    <title>Fiverr Auto Refresh Pro</title>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo-area">
                <img src="../../assets/icons/logo.png" alt="Logo" class="logo">
                <h1>Fiverr <span>Pro</span></h1>
            </div>
            <div class="subtitle">Smart Auto Refresh</div>
        </header>

        <main>
            <div class="control-group">
                <label for="interval">Refresh Interval</label>
                <div class="select-wrapper">
                    <select id="interval">
                        <option value="30000">30 Seconds</option>
                        <option value="60000">1 Minute</option>
                        <option value="120000">2 Minutes</option>
                        <option value="300000" selected>5 Minutes</option>

                        <option value="600000">10 Minutes</option>
                        <option value="1800000">30 Minutes</option>
                    </select>
                </div>
                <p class="hint">Includes ±15% "Human-like" randomization</p>
            </div>

            <div class="status-card">
                <div class="status-label">NEXT REFRESH</div>
                <div id="countdown" class="status-value">--</div>
                <div id="status-text" class="status-text">Inactive</div>
            </div>

            <div class="actions">
                <button id="start" class="btn btn-primary">Start Refreshing</button>
                <button id="stop" class="btn btn-secondary">Stop</button>
            </div>
        </main>

        <!-- Footer with hashtags removed for a cleaner, professional look -->
    </div>
    <script src="popup.js"></script>
</body>
</html>
