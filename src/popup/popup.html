<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="popup.css">
    <title>Fiverr Auto Refresh Pro</title>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo-area">
                <img src="../../assets/icons/logo.png" alt="Logo" class="logo">
                <h1>Fiverr <span>Pro</span></h1>
            </div>
            <div class="subtitle">Smart Auto Refresh</div>
        </header>



        <main>
            <div class="control-group">
                <label for="interval">Refresh Interval</label>
                <div class="select-wrapper">
                    <select id="interval">
                        <option value="30000">30 Seconds</option>
                        <option value="60000">1 Minute</option>
                        <option value="120000">2 Minutes</option>
                        <option value="300000" selected>5 Minutes</option>
                        <option value="600000">10 Minutes</option>
                        <option value="900000">15 Minutes</option>
                        <option value="1200000">20 Minutes</option>
                        <option value="1500000">25 Minutes</option>
                        <option value="1800000">30 Minutes</option>
                    </select>
                </div>
                <p class="hint">Includes 20-30% "Human-like" randomization</p>
            </div>

            <div class="status-card">
                <div class="status-label">NEXT REFRESH</div>
                <div id="countdown" class="status-value">--</div>
                <div id="status-text" class="status-text">Inactive</div>
            </div>

            <div class="actions">
                <button id="start" class="btn btn-primary">Start Refreshing</button>
                <button id="stop" class="btn btn-secondary">Stop</button>
            </div>
        </main>

        <button id="theme-toggle" class="icon-btn theme-floater" title="Toggle Theme">
            <svg class="sun" viewBox="0 0 24 24"><path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41l-1.06-1.06zm1.06-12.37c-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06c.39-.39.39-1.03 0-1.41zm-12.37 12.37c-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06c.39-.39.39-1.03 0-1.41z"/></svg>
            <svg class="moon" viewBox="0 0 24 24"><path d="M12.12 17.24a8 8 0 0 1 0-10.48 1 1 0 0 0-1.14-1.54 7.95 7.95 0 0 0-2.31 9.14A8.53 8.53 0 0 0 12.12 17.24z"/></svg>
        </button>
        <!-- Footer with hashtags removed for a cleaner, professional look -->
    </div>

    <script src="popup.js"></script>
</body>
</html>
